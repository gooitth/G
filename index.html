<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام مطابقة الصناديق والمعاملات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="text-gray-800 min-h-screen flex flex-col">

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen" class="flex items-center justify-center flex-grow p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold text-blue-600">تسجيل الدخول</h1>
                <p class="text-sm text-gray-500 mt-1">نظام مطابقة الصناديق والمعاملات</p>
            </div>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">اسم المستخدم</label>
                    <input type="text" id="username" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">كلمة المرور</label>
                    <input type="password" id="password" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg font-medium hover:bg-blue-700 transition">دخول</button>
            </form>
            <div id="login-error" class="mt-4 text-red-500 text-sm text-center hidden"></div>
        </div>
    </div>

    <!-- لوحة الموظف -->
    <div id="employee-dashboard" class="hidden flex-grow p-4 md:p-8 max-w-4xl mx-auto w-full">
        <div class="bg-white rounded-2xl shadow-md p-6 mb-6 flex justify-between items-center">
            <div>
                <h2 class="text-xl font-bold text-gray-800">مرحباً، <span id="emp-name-display"></span></h2>
                <p class="text-xs text-gray-500">شفت عمل جديد</p>
            </div>
            <button id="logout-btn" class="bg-red-50 text-red-600 px-4 py-2 rounded-lg text-sm font-medium hover:bg-red-100 transition">تسجيل خروج</button>
        </div>

        <div class="bg-white rounded-2xl shadow-md p-6">
            <h3 class="text-lg font-semibold mb-4 border-b pb-2">بيانات بداية الشفت</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">نوع الشفت</label>
                    <select id="shift-type" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                        <option value="صباحي">صباحي</option>
                        <option value="مسائي">مسائي</option>
                        <option value="ليلي">ليلي</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">النقد المستلم بداية الشفت</label>
                    <input type="number" id="opening-cash" min="0" value="0" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>
            </div>
            <button id="start-shift-btn" class="bg-green-600 text-white px-6 py-2 rounded-lg font-medium hover:bg-green-700 transition">بدء الشفت وحفظ</button>

            <!-- الحقول التي تظهر بعد بدء الشفت -->
            <div id="active-shift-fields" class="hidden mt-8 pt-6 border-t space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">النقد المعزز</label>
                    <input type="number" id="reinforcement" min="0" value="0" class="w-full px-4 py-2 border rounded-lg">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">عدد المعاملات المباعة (سعر المعاملة 2000 دينار)</label>
                    <input type="number" id="sold-count" min="0" value="0" class="w-full px-4 py-2 border rounded-lg">
                    <p class="text-sm text-gray-500 mt-1">مبلغ المعاملات المباعة: <span id="sold-amount-display" class="font-bold text-blue-600">0</span> دينار</p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">هل يوجد مباع متفرق؟</label>
                    <select id="has-misc" class="w-full px-4 py-2 border rounded-lg">
                        <option value="no">لا</option>
                        <option value="yes">نعم</option>
                    </select>
                </div>

                <div id="misc-container" class="hidden space-y-3">
                    <label class="block text-sm font-medium text-gray-700">عدد المعاملات المباعة المتفرقة</label>
                    <input type="number" id="misc-count" min="0" value="0" class="w-full px-4 py-2 border rounded-lg">
                    <div id="misc-inputs-list" class="space-y-2"></div>
                    <p class="text-sm text-gray-500">إجمالي المباع المتفرق: <span id="misc-total-display" class="font-bold text-blue-600">0</span> دينار</p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">إجمالي المبيعات</label>
                    <p class="text-lg font-bold text-indigo-600"><span id="total-sales-display">0</span> دينار</p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">عدد المعاملات غير المباعة</label>
                    <input type="number" id="unsold-count" min="0" value="0" class="w-full px-4 py-2 border rounded-lg">
                    <div id="unsold-records-list" class="space-y-3 mt-3"></div>
                </div>

                <div class="bg-blue-50 p-4 rounded-xl border border-blue-100">
                    <h4 class="text-md font-semibold text-blue-800">نقد الصندوق نهاية الشفت</h4>
                    <p class="text-2xl font-extrabold text-blue-900 mt-1"><span id="ending-cash-display">0</span> دينار</p>
                </div>

                <div class="flex space-x-4 space-x-reverse pt-4">
                    <button id="end-shift-btn" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-medium hover:bg-blue-700 transition">إنهاء الشفت وحفظ التقرير</button>
                    <button id="reset-form-btn" class="bg-gray-200 text-gray-700 px-6 py-2 rounded-lg font-medium hover:bg-gray-300 transition">تفريغ</button>
                </div>
            </div>
        </div>
    </div>

    <!-- لوحة المدير -->
    <div id="manager-dashboard" class="hidden flex-grow p-4 md:p-8 max-w-7xl mx-auto w-full">
        <div class="bg-white rounded-2xl shadow-md p-6 mb-6 flex justify-between items-center">
            <h2 class="text-2xl font-bold text-gray-800">لوحة تحكم المدير</h2>
            <button id="manager-logout-btn" class="bg-red-50 text-red-600 px-4 py-2 rounded-lg text-sm font-medium hover:bg-red-100 transition">تسجيل خروج</button>
        </div>
        <div class="bg-white rounded-2xl shadow-md p-6">
            <h3 class="text-lg font-semibold mb-4">تقارير الشفتات</h3>
            <div id="manager-reports-list" class="overflow-x-auto">
                <p class="text-gray-500">جاري تحميل التقارير...</p>
            </div>
        </div>
    </div>

    <footer class="text-center py-4 text-xs text-gray-400">
        صنع بواسطة غيث
    </footer>

    <script type="module" src="app.js"></script>
</body>
</html>
